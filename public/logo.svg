<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <!-- Styles cho animation chạy độc lập bên trong SVG -->
        <style>
            .floating-logo {
                animation: float 6s ease-in-out infinite;
                transform-origin: center;
            }
            @keyframes float {
                0% { transform: translateY(0px) scale(1); }
                50% { transform: translateY(-10px) scale(1.02); }
                100% { transform: translateY(0px) scale(1); }
            }
            .sparkle-spin {
                transform-origin: 400px 240px;
                animation: spin 20s linear infinite;
            }
            @keyframes spin {
                100% { transform: rotate(360deg); }
            }
        </style>

        <!-- Radial Glow Backgrounds -->
        <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
        </radialGradient>

        <!-- 3D Fold Gradients for Green Leaves -->
        <linearGradient id="foldLeftGreen" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#064E3B"/>
        </linearGradient>
        <linearGradient id="foldRightGreen" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6EE7B7"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>

        <!-- 3D Fold Gradients for Gold Leaves -->
        <linearGradient id="foldLeftGold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#78350F"/>
        </linearGradient>
        <linearGradient id="foldRightGold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FEF08A"/>
            <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>

        <!-- Gradient cho dòng chữ LUCKY -->
        <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#F1F5F9"/>
            <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>

        <!-- Components: Lá Xanh -->
        <g id="leafGreen">
            <path d="M 0 0 C -60 -30, -70 -90, -30 -110 C -10 -120, 0 -80, 0 -60 Z" fill="url(#foldLeftGreen)"/>
            <path d="M 0 0 C 60 -30, 70 -90, 30 -110 C 10 -120, 0 -80, 0 -60 Z" fill="url(#foldRightGreen)"/>
        </g>

        <!-- Components: Lá Vàng -->
        <g id="leafGold">
            <path d="M 0 0 C -60 -30, -70 -90, -30 -110 C -10 -120, 0 -80, 0 -60 Z" fill="url(#foldLeftGold)"/>
            <path d="M 0 0 C 60 -30, 70 -90, 30 -110 C 10 -120, 0 -80, 0 -60 Z" fill="url(#foldRightGold)"/>
        </g>

        <!-- Ngôi sao nhỏ (Sparkle) -->
        <path id="sparkle" d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="#FDE68A" />
    </defs>

    <!-- Background tối (Bạn có thể đổi #050810 thành 'transparent' nếu muốn nền trong suốt) -->
    <rect width="100%" height="100%" fill="#050810" />

    <!-- Group bọc toàn bộ để tạo hiệu ứng nhịp thở (floating) -->
    <g class="floating-logo">
        <!-- Ánh sáng nền (Glow) -->
        <circle cx="400" cy="240" r="220" fill="url(#glowGreen)"/>
        <circle cx="400" cy="240" r="160" fill="url(#glowGold)"/>

        <!-- Vòng tròn trang trí (Deco Rings) -->
        <circle cx="400" cy="240" r="125" fill="none" stroke="url(#foldRightGold)" stroke-width="1.5" opacity="0.3" stroke-dasharray="8 4"/>
        <circle cx="400" cy="240" r="140" fill="none" stroke="url(#foldRightGreen)" stroke-width="1" opacity="0.2"/>

        <!-- Khối LOGO ICON (Cỏ 4 lá) -->
        <g transform="translate(400, 240)">
            <use href="#leafGreen" transform="rotate(0)" />
            <use href="#leafGreen" transform="rotate(180)" />
            <use href="#leafGold" transform="rotate(90)" />
            <use href="#leafGold" transform="rotate(270)" />
            
            <!-- Tâm logo phát sáng -->
            <use href="#sparkle" transform="scale(1.2)" />
            <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 5px #FDE68A)"/>
        </g>

        <!-- Các hạt bụi phép thuật xoay vòng (Magic Dust) -->
        <g class="sparkle-spin">
            <use href="#sparkle" transform="translate(260, 100) scale(0.8)" opacity="0.8"/>
            <use href="#sparkle" transform="translate(540, 120) scale(0.6)" opacity="0.6"/>
            <use href="#sparkle" transform="translate(280, 360) scale(0.5)" opacity="0.7"/>
            <use href="#sparkle" transform="translate(520, 350) scale(0.9)" opacity="0.9"/>
            
            <circle cx="400" cy="80" r="3" fill="#34D399" opacity="0.6"/>
            <circle cx="400" cy="400" r="4" fill="#34D399" opacity="0.4"/>
            <circle cx="210" cy="240" r="3" fill="#FDE68A" opacity="0.5"/>
            <circle cx="590" cy="240" r="4" fill="#FDE68A" opacity="0.5"/>
        </g>

        <!-- TYPOGRAPHY (Phần Chữ) -->
        <g text-anchor="middle">
            <text x="400" y="440" 
                  font-family="system-ui, -apple-system, sans-serif" 
                  font-weight="900" 
                  font-size="56" 
                  style="letter-spacing: 16px;" 
                  fill="url(#textGrad)">
                LUCKY
            </text>

            <line x1="330" y1="465" x2="470" y2="465" stroke="url(#foldRightGold)" stroke-width="1.5" opacity="0.7"/>
            <circle cx="400" cy="465" r="3" fill="#FDE68A"/>

            <text x="400" y="505" 
                  font-family="system-ui, -apple-system, sans-serif" 
                  font-weight="400" 
                  font-size="20" 
                  style="letter-spacing: 24px;" 
                  fill="#FDE68A"
                  opacity="0.9">
                EVENT
            </text>
        </g>
    </g>
</svg>